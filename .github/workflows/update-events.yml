name: Update events

# Pulls upcoming events from official university and students' union calendars
# into events.json, twice a day. GitHub Pages republishes the site automatically.
on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC (06:15 London in summer)
    - cron: "15 15 * * *"  # 15:15 UTC, afternoon refresh
  workflow_dispatch: {}    # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch events from official sources
        env:
          TZ: Europe/London
        run: python scripts/update_events.py
      - name: Commit if anything changed
        run: |
          git config user.name "unilondon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "No changes to events."
          else
            git commit -m "Update events from official calendars ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
